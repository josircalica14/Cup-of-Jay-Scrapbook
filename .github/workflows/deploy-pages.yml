name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A Pages project site is served from /<repo>/, so the build needs that prefix.
      # If the repository is ever renamed, change this to match.
      - run: npm run build
        env:
          VITE_BASE_PATH: Cup-of-Jay-Scrapbook

      # deploy-pages needs Pages set to the "GitHub Actions" source. enablement asks
      # GitHub to set that up rather than failing with "Get Pages site failed"; if the
      # workflow token may not change repository settings it still fails, and the one
      # manual fix is Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

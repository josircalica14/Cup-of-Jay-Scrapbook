name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A Pages project site is served from /<repo>/, so the build needs that prefix.
      # If the repository is ever renamed, change this to match.
      - run: npm run build
        env:
          VITE_BASE_PATH: Cup-of-Jay-Scrapbook

      # deploy-pages only works once Pages is set to the "GitHub Actions" source, and a
      # fresh repository still says "Deploy from a branch" (which publishes the raw,
      # unbuilt source). Switch it here, with the workflow token, so the deploy is
      # self-configuring. A 403 below means this token may not change repository
      # settings: set it once by hand instead —
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      - name: Point Pages at the GitHub Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          read_code=$(curl -s -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          echo "current Pages config: HTTP $read_code"

          # 404 with no site yet means create it; anything else means update the existing one
          verb=PUT
          if [ "$read_code" = "404" ]; then verb=POST; fi
          code=$(curl -s -o /tmp/pages-set.json -w "%{http_code}" -X "$verb" "${headers[@]}" -d '{"build_type":"workflow"}' "$api")
          echo "set build_type=workflow via $verb: HTTP $code"

          # 409 means the site already exists, so the create call is the wrong verb
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -s -o /tmp/pages-set.json -w "%{http_code}" -X PUT "${headers[@]}" -d '{"build_type":"workflow"}' "$api")
            echo "set build_type=workflow via PUT: HTTP $code"
          fi

          cat /tmp/pages-set.json 2>/dev/null || true
          echo
          if [ "$code" -ge 300 ]; then
            echo "::error::Could not switch Pages to the GitHub Actions source (HTTP $code). Set Settings -> Pages -> Build and deployment -> Source: GitHub Actions once, then re-run this job."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cup of Jay — a little book of my days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { serif:['Instrument Serif','Georgia','serif'], hand:['Caveat','Comic Sans MS','cursive'], ui:['Inter','system-ui','sans-serif'] },
  colors: { paper:'#FAF7F2', ink:'#1F1F1F', mute:'#6B6B66', line:'#E4DFD6', sage:'#D5DDCB', blush:'#F2D9D3', sky:'#D6E2EC', butter:'#F4E8B8', acc:'#3F5BD8' }
}}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:72px; }
body { background:#FAF7F2; background-image: radial-gradient(#E4DFD6 1px, transparent 1px); background-size:24px 24px; color:#1F1F1F; font-family:'Inter',system-ui,sans-serif; overflow-x:hidden; }
@keyframes eq { 0%,100%{transform:scaleY(.2)} 50%{transform:scaleY(1)} }
.eq { transform-origin:bottom; animation: eq .9s ease-in-out infinite; }
.lined { background-image: repeating-linear-gradient(transparent 0 35px, #E4DFD6 35px 36px); }
.card { background:#fff; border:1px solid #E4DFD6; box-shadow: 0 1px 0 #E4DFD6, 0 12px 24px -16px rgba(60,50,30,.25); }
@media (prefers-reduced-motion: reduce){ .eq{animation:none} html{scroll-behavior:auto} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ===================== DATA (edit me) ===================== */
const MOMENTS_DATA = [
  { id:1, title:'Golden hour, Calamba', tag:'Places', date:'Sep 2026', caption:'the sky was showing off', scene:'sunset', tone:['#F2D9D3','#3F5BD8'], rot:-2 },
  { id:2, title:'Last jeep home', tag:'Everyday', date:'Aug 2026', caption:'window seat, always', scene:'jeep', tone:['#D6E2EC','#F2D9D3'], rot:2 },
  { id:3, title:'Palengke morning', tag:'Food', date:'Aug 2026', caption:'mangoes beat deadlines', scene:'street', tone:['#F4E8B8','#D5DDCB'], rot:-1 },
  { id:4, title:'Third coffee', tag:'Food', date:'Jul 2026', caption:'no regrets (some regrets)', scene:'cup', tone:['#D5DDCB','#8A5A3B'], rot:2 },
  { id:5, title:'Lake walk', tag:'Places', date:'Jul 2026', caption:'the quiet kind of Sunday', scene:'lake', tone:['#D6E2EC','#3F5BD8'], rot:-2 },
  { id:6, title:'Desk, 1 a.m.', tag:'Everyday', date:'Jun 2026', caption:'one more bug, then sleep', scene:'cup', tone:['#F2D9D3','#1F1F1F'], rot:1 },
];
const DIARY_DATA = [
  { id:1, date:'Oct 20', mood:'cozy', title:'Rainy afternoon', body:'It rained so hard the street turned into a mirror. I stayed in, edited a few photos, and let the playlist loop. Small day, good day.' },
  { id:2, date:'Oct 14', mood:'proud', title:'Finally finished the thing', body:'The queue app works on an actual phone, on an actual jeepney. I did a tiny dance in the hallway and nobody saw. Probably.' },
  { id:3, date:'Oct 03', mood:'sleepy', title:'Over-caffeinated again', body:'Four cups. I can hear colors. Note to self: water exists, and it is also a drink.' },
];
const NOW_DATA = [
  { label:'Listening', value:'lo-fi, rain sounds, old OPM', color:'#D6E2EC' },
  { label:'Reading', value:'a very long manga backlog', color:'#F4E8B8' },
  { label:'Making', value:'film-ish edits of ordinary streets', color:'#F2D9D3' },
  { label:'Craving', value:'halo-halo, any weather', color:'#D5DDCB' },
];
const STICKER_LINKS = [
  { platform:'Instagram', handle:'@cupofjayyy_', url:'https://instagram.com/cupofjayyy_', color:'#F2D9D3', rot:-3 },
  { platform:'GitHub', handle:'cupofjay', url:'https://github.com/', color:'#D6E2EC', rot:2 },
  { platform:'Email', handle:'say hi', url:'mailto:hello@example.com', color:'#F4E8B8', rot:-2 },
];
const GUESTBOOK_DATA = [
  { name:'Mika', message:'Your photos feel like a warm blanket.', timestamp:'2026-09-12 14:02' },
  { name:'Kuya Ben', message:'Kain tayo pag nasa Laguna ka!', timestamp:'2026-09-30 08:41' },
];

/* ===================== HELPERS ===================== */
function Scene({ type, tone=['#F2D9D3','#3F5BD8'] }) {
  const [a,b] = tone;
  return (
    <svg viewBox="0 0 200 150" className="w-full h-full block" role="img" aria-label={type + ' photo'} preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="150" fill={a}/>
      {type==='sunset' && <><circle cx="140" cy="60" r="24" fill="#FAF7F2"/><path d="M0 105 Q50 80 100 102 T200 98 V150 H0Z" fill={b} opacity=".85"/><path d="M0 128 Q60 112 120 126 T200 122 V150 H0Z" fill="#1F1F1F" opacity=".15"/></>}
      {type==='jeep' && <><rect x="25" y="68" width="150" height="48" rx="12" fill={b}/><rect x="40" y="78" width="30" height="20" rx="3" fill="#FAF7F2"/><rect x="80" y="78" width="30" height="20" rx="3" fill="#FAF7F2"/><circle cx="55" cy="118" r="11" fill="#1F1F1F"/><circle cx="145" cy="118" r="11" fill="#1F1F1F"/></>}
      {type==='street' && <><rect x="18" y="62" width="48" height="88" fill={b}/><rect x="76" y="40" width="48" height="110" fill="#FAF7F2" opacity=".8"/><rect x="134" y="72" width="48" height="78" fill="#1F1F1F" opacity=".2"/><circle cx="100" cy="22" r="9" fill="#FAF7F2"/></>}
      {type==='cup' && <><path d="M62 54h66v44a26 26 0 0 1-26 26h-14a26 26 0 0 1-26-26z" fill={b}/><path d="M128 66h10a14 14 0 0 1 0 28h-10" fill="none" stroke={b} strokeWidth="8"/><path d="M82 40q6-10 0-18M102 40q6-10 0-18" stroke="#FAF7F2" strokeWidth="4" fill="none" strokeLinecap="round"/></>}
      {type==='lake' && <><circle cx="60" cy="48" r="18" fill="#FAF7F2"/><path d="M0 90h200v60H0z" fill={b} opacity=".8"/><path d="M20 110h60M100 124h70M40 136h50" stroke="#FAF7F2" strokeWidth="3" strokeLinecap="round"/></>}
    </svg>
  );
}

function Tape({ className='' }) {
  return <span aria-hidden="true" className={`absolute w-20 h-5 bg-butter/80 border border-black/5 ${className}`}/>;
}

function Polaroid({ children, caption, sub, rotation=0, className='' }) {
  return (
    <figure style={{ transform:`rotate(${rotation}deg)` }} className={`card relative p-3 pb-4 transition-transform hover:-translate-y-1 ${className}`}>
      <Tape className="-top-2.5 left-1/2 -translate-x-1/2 -rotate-2"/>
      <div className="aspect-[4/3] overflow-hidden bg-line">{children}</div>
      <figcaption className="mt-3 px-1">
        <p className="font-hand text-2xl leading-none">{caption}</p>
        {sub && <p className="text-[11px] tracking-widest uppercase text-mute mt-1">{sub}</p>}
      </figcaption>
    </figure>
  );
}

const Eyebrow = ({ children }) => <p className="text-[11px] tracking-[.25em] uppercase text-mute mb-2">{children}</p>;
const Squiggle = () => (
  <svg viewBox="0 0 120 12" className="w-28 h-3 text-acc mt-1" fill="none" aria-hidden="true"><path d="M2 7c10-8 15 6 25-1s15 6 25-1 15 6 25-1 15 6 25-1" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
);

/* ===================== NAV ===================== */
function Navbar() {
  const links = [['hello','#home'],['moments','#moments'],['diary','#diary'],['little things','#things'],['guestbook','#guestbook']];
  return (
    <nav className="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-line" style={{ paddingTop:'env(safe-area-inset-top,0px)' }}>
      <div className="max-w-5xl mx-auto px-5 h-12 flex items-center gap-6 overflow-x-auto text-sm">
        <a href="#home" className="font-serif text-xl italic shrink-0">cup of jay</a>
        <span className="flex gap-5 ml-auto text-mute whitespace-nowrap">
          {links.map(([t,h]) => <a key={h} href={h} className="hover:text-ink transition-colors">{t}</a>)}
        </span>
      </div>
    </nav>
  );
}

/* ===================== HERO ===================== */
function Hero() {
  return (
    <header id="home" className="max-w-5xl mx-auto px-5 pt-16 pb-24 grid md:grid-cols-5 gap-12 items-center min-h-[80dvh]">
      <div className="md:col-span-3">
        <Eyebrow>a little book of my days · vol. 01</Eyebrow>
        <h1 className="font-serif text-6xl sm:text-7xl lg:text-8xl leading-[.95] tracking-tight">
          Small days,<br/><em className="text-acc">kept</em> on paper.
        </h1>
        <Squiggle/>
        <p className="mt-6 max-w-md text-mute leading-relaxed">Hi, I’m Josir James, but most people call me Jay. This is where I keep the photos, coffee counts and quiet thoughts that don’t fit anywhere else.</p>
        <div className="mt-8 flex gap-3 text-sm">
          <a href="#moments" className="bg-ink text-paper px-5 py-2.5 rounded-full hover:-translate-y-0.5 transition-transform active:translate-y-0">Flip through</a>
          <a href="#diary" className="border border-ink px-5 py-2.5 rounded-full hover:bg-ink hover:text-paper transition-colors">Read the diary</a>
        </div>
      </div>
      <div className="md:col-span-2 relative">
        <Polaroid rotation={3} caption="laguna, golden hour" sub="sep 2026" className="max-w-xs mx-auto">
          <Scene type="sunset" tone={['#F2D9D3','#3F5BD8']}/>
        </Polaroid>
        <div className="absolute -bottom-6 -left-2 sm:left-0 rotate-[-4deg] bg-butter px-4 py-3 text-sm font-hand text-2xl leading-tight max-w-[11rem] shadow-sm">
          currently: coffee, rain, and a photo backlog
        </div>
      </div>
    </header>
  );
}

/* ===================== ABOUT ===================== */
function About() {
  const facts = [['Based in','Laguna, PH'],['Handle','@cupofjayyy_'],['Day job','Frontend dev'],['Night job','Photo editing'],['Fuel','Coffee, obviously']];
  return (
    <section className="max-w-5xl mx-auto px-5 py-20 grid md:grid-cols-2 gap-12">
      <div>
        <Eyebrow>01 · hello</Eyebrow>
        <h2 className="font-serif text-4xl mb-6">A few things about me</h2>
        <dl className="divide-y divide-line border-y border-line">
          {facts.map(([k,v]) => <div key={k} className="flex justify-between py-3 text-sm"><dt className="text-mute">{k}</dt><dd>{v}</dd></div>)}
        </dl>
      </div>
      <div className="card lined p-7 -rotate-1 relative">
        <Tape className="-top-2.5 right-8 rotate-3"/>
        <p className="font-hand text-[28px] leading-[36px]">
          I’m a fresh IT grad from Laguna who loves ordinary things: jeepney rides, rainy windows, a good cup of coffee. I make websites by day and edit photos by night. This book is the unpolished version of me.
        </p>
        <p className="font-hand text-[28px] leading-[36px] text-acc mt-[36px]">— Jay</p>
      </div>
    </section>
  );
}

/* ===================== MOMENTS ===================== */
function Moments() {
  const tags = ['All','Places','Food','Everyday'];
  const [tag, setTag] = useState('All');
  const list = useMemo(() => MOMENTS_DATA.filter(m => tag==='All' || m.tag===tag), [tag]);
  return (
    <section id="moments" className="max-w-5xl mx-auto px-5 py-20">
      <Eyebrow>02 · moments</Eyebrow>
      <div className="flex flex-wrap items-end justify-between gap-4 mb-10">
        <h2 className="font-serif text-4xl">Pages I pasted in</h2>
        <div role="tablist" className="flex gap-2 text-sm">
          {tags.map(t => (
            <button key={t} role="tab" aria-selected={tag===t} onClick={() => setTag(t)}
              className={`px-4 py-1.5 rounded-full border transition-colors ${tag===t ? 'bg-ink text-paper border-ink' : 'border-line text-mute hover:border-ink hover:text-ink'}`}>{t}</button>
          ))}
        </div>
      </div>
      {list.length === 0 && <p className="font-hand text-2xl text-mute">this page is still blank…</p>}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-10">
        {list.map(m => (
          <Polaroid key={m.id} rotation={m.rot} caption={m.caption} sub={`${m.title} · ${m.date}`}>
            <Scene type={m.scene} tone={m.tone}/>
          </Polaroid>
        ))}
      </div>
    </section>
  );
}

/* ===================== DIARY ===================== */
function Diary() {
  const [open, setOpen] = useState(1);
  return (
    <section id="diary" className="max-w-3xl mx-auto px-5 py-20">
      <Eyebrow>03 · diary</Eyebrow>
      <h2 className="font-serif text-4xl mb-8">Dear diary,</h2>
      <ul className="border-t border-line">
        {DIARY_DATA.map(d => {
          const isOpen = open === d.id;
          return (
            <li key={d.id} className="border-b border-line">
              <button onClick={() => setOpen(isOpen ? null : d.id)} aria-expanded={isOpen} className="w-full text-left py-5 flex items-baseline gap-5 group">
                <span className="font-hand text-2xl text-acc w-16 shrink-0">{d.date}</span>
                <span className="font-serif text-2xl flex-1 group-hover:italic">{d.title}</span>
                <span className="text-[11px] tracking-widest uppercase text-mute">{d.mood}</span>
                <span aria-hidden="true" className="text-mute">{isOpen ? '−' : '+'}</span>
              </button>
              {isOpen && <p className="font-hand text-[26px] leading-9 pb-6 pl-0 sm:pl-[84px] text-ink/90">{d.body}</p>}
            </li>
          );
        })}
      </ul>
    </section>
  );
}

/* ===================== LITTLE THINGS ===================== */
function Coffee() {
  const [n, setN] = useState(0);
  const msg = ['None yet. Brave.','Warming up.','A good pace.','Productive buzz.','Seeing colors.','Please drink water.'][Math.min(n,5)];
  return (
    <div className="card p-6">
      <Eyebrow>coffee count</Eyebrow>
      <div className="flex gap-1.5 my-3" aria-label={`${n} cups`}>
        {Array.from({length:6}).map((_,i) => (
          <svg key={i} viewBox="0 0 40 40" className="w-8 h-8 transition-transform" style={{ transform: i<n ? 'scale(1.1)' : 'scale(1)' }} aria-hidden="true">
            <path d="M6 12h24v14a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z" fill={i<n ? '#8A5A3B' : 'none'} stroke="#1F1F1F" strokeWidth="2"/>
            <path d="M30 15h3a4 4 0 0 1 0 9h-3" fill="none" stroke="#1F1F1F" strokeWidth="2"/>
          </svg>
        ))}
      </div>
      <p className="font-hand text-2xl h-8">{msg}</p>
      <div className="flex gap-2 mt-3 text-sm">
        <button onClick={() => setN(Math.min(6,n+1))} className="bg-ink text-paper rounded-full px-4 py-1.5 active:scale-95 transition-transform">+ one more</button>
        <button onClick={() => setN(0)} className="border border-line rounded-full px-4 py-1.5 text-mute hover:text-ink">reset</button>
      </div>
    </div>
  );
}

function Player() {
  const [on, setOn] = useState(false);
  const [t, setT] = useState(12);
  useEffect(() => {
    if (!on) return;
    const id = setInterval(() => setT(v => v >= 100 ? 0 : v + 1), 400);
    return () => clearInterval(id);
  }, [on]);
  return (
    <div className="card p-6">
      <Eyebrow>now playing</Eyebrow>
      <p className="font-serif text-2xl">Rainy Jeepney</p>
      <p className="text-sm text-mute">lo-fi · for staying in</p>
      <div className="flex items-end gap-1 h-10 my-4" aria-hidden="true">
        {Array.from({length:16}).map((_,i) => <span key={i} className="eq flex-1 bg-acc/70 rounded-sm h-full" style={{ animationDelay:`${(i*83)%800}ms`, animationPlayState:on?'running':'paused' }}/>)}
      </div>
      <input type="range" min="0" max="100" value={t} onChange={e => setT(+e.target.value)} aria-label="Track position" className="w-full accent-[#3F5BD8]"/>
      <button onClick={() => setOn(!on)} className="mt-3 bg-ink text-paper rounded-full px-5 py-1.5 text-sm active:scale-95 transition-transform">{on ? 'Pause' : 'Play'}</button>
    </div>
  );
}

function Mood() {
  const moods = [['sunny','#F4E8B8'],['cozy','#F2D9D3'],['calm','#D6E2EC'],['tired','#D5DDCB']];
  const [m, setM] = useState(null);
  return (
    <div className="card p-6">
      <Eyebrow>today’s mood</Eyebrow>
      <div className="grid grid-cols-2 gap-2 mt-3">
        {moods.map(([n,c]) => (
          <button key={n} onClick={() => setM(n)} style={{ background:c }} aria-pressed={m===n}
            className={`rounded-xl py-3 text-sm transition-all active:scale-95 ${m===n ? 'ring-2 ring-ink' : ''}`}>{n}</button>
        ))}
      </div>
      <p className="font-hand text-2xl mt-3 h-8">{m ? `Noted: feeling ${m}.` : 'How are you today?'}</p>
    </div>
  );
}

function LittleThings() {
  return (
    <section id="things" className="max-w-5xl mx-auto px-5 py-20">
      <Eyebrow>04 · little things</Eyebrow>
      <h2 className="font-serif text-4xl mb-8">Poke around</h2>
      <div className="grid md:grid-cols-3 gap-6 items-start">
        <Coffee/><Player/><Mood/>
      </div>
      <h3 className="font-serif text-2xl mt-16 mb-4">Right now</h3>
      <ul className="grid sm:grid-cols-2 gap-3">
        {NOW_DATA.map(n => (
          <li key={n.label} style={{ background:n.color }} className="rounded-2xl px-5 py-4">
            <p className="text-[11px] tracking-widest uppercase text-ink/60">{n.label}</p>
            <p className="font-hand text-2xl leading-tight">{n.value}</p>
          </li>
        ))}
      </ul>
    </section>
  );
}

/* ===================== GUESTBOOK / FOOTER ===================== */
function Guestbook() {
  const [entries, setEntries] = useState(() => {
    try { const s = localStorage.getItem('coj-guestbook'); if (s) return JSON.parse(s); } catch (e) {}
    return GUESTBOOK_DATA;
  });
  const [name, setName] = useState('');
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  useEffect(() => { try { localStorage.setItem('coj-guestbook', JSON.stringify(entries)); } catch (e) {} }, [entries]);
  const submit = () => {
    if (!name.trim() || !msg.trim()) { setErr('Please add a name and a message.'); return; }
    const ts = new Date().toISOString().slice(0,16).replace('T',' ');
    setEntries([{ name:name.trim(), message:msg.trim(), timestamp:ts }, ...entries]);
    setName(''); setMsg(''); setErr('');
  };
  const inp = 'w-full bg-transparent border-b border-ink/30 focus:border-acc outline-none py-2 text-base';
  return (
    <footer id="guestbook" className="border-t border-line bg-white/60">
      <div className="max-w-5xl mx-auto px-5 py-20 grid md:grid-cols-2 gap-14">
        <div>
          <Eyebrow>05 · guestbook</Eyebrow>
          <h2 className="font-serif text-4xl mb-6">Leave a note</h2>
          <div className="grid gap-5">
            <div><label htmlFor="gn" className="text-sm text-mute">Your name</label><input id="gn" value={name} onChange={e => setName(e.target.value)} className={inp}/></div>
            <div><label htmlFor="gm" className="text-sm text-mute">Message</label><textarea id="gm" rows="3" value={msg} onChange={e => setMsg(e.target.value)} className={inp}/></div>
            {err && <p role="alert" className="text-sm text-red-700">{err}</p>}
            <button onClick={submit} className="self-start bg-ink text-paper rounded-full px-6 py-2.5 text-sm active:scale-95 transition-transform">Sign the page</button>
          </div>
          <div className="flex flex-wrap gap-4 mt-12">
            {STICKER_LINKS.map(s => (
              <a key={s.platform} href={s.url} target="_blank" rel="noreferrer" style={{ background:s.color, transform:`rotate(${s.rot}deg)` }}
                 className="rounded-full px-5 py-2 text-sm hover:scale-105 hover:rotate-0 transition-transform">
                <span className="font-medium">{s.platform}</span> <span className="text-ink/60">{s.handle}</span>
              </a>
            ))}
          </div>
        </div>
        <ul className="grid gap-4 content-start">
          {entries.map((e,i) => (
            <li key={e.timestamp + i} className={`card p-4 ${i%2 ? 'rotate-1' : '-rotate-1'}`}>
              <p className="font-hand text-2xl leading-tight">{e.message}</p>
              <p className="text-xs text-mute mt-2">{e.name} · {e.timestamp}</p>
            </li>
          ))}
        </ul>
      </div>
      <p className="text-center text-xs text-mute pb-10">© 2026 Cup of Jay · Laguna, PH · made slowly, with coffee</p>
    </footer>
  );
}

function App() {
  return (<><Navbar/><main><Hero/><About/><Moments/><Diary/><LittleThings/></main><Guestbook/></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
